test-holidays:
  name: Testes de feriados (instalacao limpa)
  runs-on: ubuntu-latest

  steps:
    - uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest

    - name: Build e instalar o wheel (sem dev deps, sem extras)
      run: |
        poetry build -f wheel
        pip install dist/*.whl pytest

    - name: Regressao 07/09/2026
      run: |
        python - <<'PY'
        from pyettj import ettj
        dias = ettj.listar_dias_uteis("31/08/2026", "08/09/2026")
        assert "07/09/2026" not in dias, dias
        assert dias[0] == "31/08/2026", dias
        print("OK:", dias)
        PY

    - name: Testes de feriados
      run: pytest tests/ -m "not network" -v -k "feriado or ordenado or setembro or natal or tiradentes"
